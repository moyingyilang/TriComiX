org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 主项目实测有效，这里直接沿用（见主项目 docs/engineering-notes.md）
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

android.useAndroidX=true

# --- Termux / aarch64 本机构建（照搬主项目 JMNeXt 已验证的规避）---
# AGP 会从 Maven 拉 linux-x86_64 的 aapt2，在 aarch64 上跑不起来；
# 指向本地 build-tools 里的 arm64 版（35.0.1 是 arm64，35.0.0/36.0.0 是 x86-64）。
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/android-sdk/build-tools/35.0.1/aapt2

# 关闭 AGP 的资源优化步骤：在 aarch64 + arm64 aapt2 下它会产出空资源表
# （release 包缺 AndroidManifest.xml 与 resources.arsc，安装直接失败）。
android.enableResourceOptimizations=false
